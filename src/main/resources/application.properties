server.port=8080    
spring.application.name=project
spring.datasource.url=${POSTGRE_URL}
spring.datasource.username=${POSTGRE_USERNAME}
spring.datasource.password=${POSTGRE_PASSWORD}
spring.jpa.hibernate.ddl-auto=create

jwt_secret_password=${JWT_SECRET}
accessToken_expiration=${ACCESS_EXPIRATION}
refreshToken_expiration=${REFRESH_EXPIRATION}

aws.s3.bucket-name=${AWS_BUCKET_NAME}
aws.s3.regions=${AWS_REGIONS}
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}

spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASS}

